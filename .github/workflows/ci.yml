name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest
      - run: pytest -q sovereign-lens/tests
      - run: python -m pip install -e "sovereign-lens/repo-bootstrap[dev]"
      - run: pytest -q
        working-directory: sovereign-lens/repo-bootstrap
